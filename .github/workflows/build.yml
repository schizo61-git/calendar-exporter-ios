name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure XcodeGen is available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app (no code signing)
        run: |
          xcodebuild \
            -project CalendarExporter.xcodeproj \
            -scheme CalendarExporter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .ipa (unsigned; Sideloadly will resign on install)
        run: |
          set -eu
          APP_PATH="build/Build/Products/Release-iphoneos/CalendarExporter.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CalendarExporter.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CalendarExporter-unsigned-ipa
          path: CalendarExporter.ipa
          retention-days: 14
